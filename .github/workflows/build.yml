name: Build Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: apple-silicon-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.upstream.outputs.build }}
      engine: ${{ steps.upstream.outputs.engine }}
      game: ${{ steps.upstream.outputs.game }}
      tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test build orchestration
        run: python3 -m unittest discover -s tests -v
      - name: Check both upstream repositories
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: flareteam/flare-engine
          ref: ${{ needs.check.outputs.engine }}
          path: work/flare-engine
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: flareteam/flare-game
          ref: ${{ needs.check.outputs.game }}
          path: work/flare-game
          sparse-checkout: |
            mods
          persist-credentials: false
      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          cmake --version
          clang --version
      - name: Build pinned dependencies and engine
        run: python3 scripts/build.py
      - name: Package and verify app
        run: python3 scripts/package.py
      - name: Check archive integrity
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          unzip -tq Flare-AppleSilicon.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/Flare-AppleSilicon.zip
            dist/Flare-corresponding-source.tar.gz
            dist/BUILD-INFO.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: python3 scripts/publish.py
